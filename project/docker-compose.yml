version: "3.8"

services:
  server:
    build: .
    container_name: childhelper-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FCM_ACCESS_TOKEN=${FCM_ACCESS_TOKEN:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - TURN_SERVER_URL=${TURN_SERVER_URL:-turn:turn:3478}
      - TURN_USERNAME=${TURN_USERNAME:-childhelper}
      - TURN_SECRET=${TURN_SECRET:-changeme}
      - TURN_CREDENTIAL_TTL_SECONDS=${TURN_CREDENTIAL_TTL_SECONDS:-86400}
      - STUN_SERVER_URL=${STUN_SERVER_URL:-stun:stun.l.google.com:19302}
    restart: unless-stopped

  turn:
    image: coturn/coturn:4.6-alpine
    container_name: childhelper-turn
    network_mode: host
    command:
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49160
      - --max-port=49200
      - --realm=childhelper.com
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-changeme}
      - --no-cli
      - --verbose
    restart: unless-stopped
